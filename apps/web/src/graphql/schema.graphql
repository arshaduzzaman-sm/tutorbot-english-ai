type Attempt {
  id: ID!
  createdAt: DateTime!
  mode: String!
  isCorrect: Boolean
  scoreRatio: Float
  category: QuestionCategory
}

"""Date (isoformat)"""
scalar Date

"""Date with time (isoformat)"""
scalar DateTime

type Exercise {
  id: String!
  type: String!
  prompt: String!
  options: [String!]!
  hint: String
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

type LearningLevel {
  id: ID!
  code: Int!
  slug: String!
  name: String!
  cefr: String!
  description: String!
}

type Lesson {
  id: ID!
  slug: String!
  title: String!
  summary: String!
  estimatedMinutes: Int!
  level: LearningLevel

  """Slug of the unit this lesson belongs to; null if none"""
  unitSlug: String

  """True when the lesson's unit is still locked for the viewer"""
  locked: Boolean!

  """The viewer's progress on this lesson; null if not started"""
  progress: LessonProgress
  sections: [LessonSection!]!
}

type LessonProgress {
  status: String!
  bestScore: Float
  completedAt: DateTime
}

type LessonSection {
  kind: String!
  title: String!
  bodyMd: String!
  exercises: [Exercise!]!
}

type MockExam {
  id: ID!
  kind: String!
  status: String!
  startedAt: DateTime!
  completedAt: DateTime
}

type PlacementItem {
  id: String!
  level: Int!
  skill: String!
  prompt: String!
  passage: String
  options: [String!]!
  hasAudio: Boolean!
}

type PlacementTest {
  slug: String!
  title: String!
  estimatedMinutes: Int!
  items: [PlacementItem!]!
}

type PracticeQuestion {
  id: ID!
  externalId: String!
  categoryCode: String!
  difficulty: String!
  instructions: String!
  learningObjective: String!

  """Task content without answers (text, blanks, passage, ...)"""
  content: JSON!
  category: QuestionCategory

  """Answer options in order, without which ones are correct"""
  options: [QuestionOption!]!
}

type PracticeTypeStats {
  category: QuestionCategory!
  questionCount: Int!
  autoMarked: Boolean!

  """The viewer's attempts at this task type"""
  attempts: Int!

  """Mean practice score ratio 0-1; null if no attempts"""
  averageScore: Float
}

type Profile {
  displayName: String
  targetScore: Int
  examDate: Date
  dailyGoalMinutes: Int!
  onboardingCompleted: Boolean!
  level: LearningLevel
}

type Progress {
  lessonsCompleted: Int!
  lessonsTotal: Int!
  skills: [SkillProgress!]!
  overallRatio: Float!
}

type Query {
  viewer: Viewer!
  learningLevels: [LearningLevel!]!

  """Published lessons, optionally for one level, in course order"""
  lessons(levelCode: Int = null): [Lesson!]!
  lesson(slug: String!): Lesson

  """
  Task types of one section with question counts and the viewer's results
  """
  practiceTypes(section: String!): [PracticeTypeStats!]!

  """Published questions of one task type, easiest first"""
  practiceQuestions(categoryCode: String!, limit: Int! = 50): [PracticeQuestion!]!
  practiceQuestion(id: ID!): PracticeQuestion

  """The current placement (diagnostic) test, without answers"""
  placementTest: PlacementTest

  """Published units in course order, optionally for one level"""
  units(levelCode: Int = null): [Unit!]!
  unit(slug: String!): Unit
  questionCategories: [QuestionCategory!]!
}

type QuestionCategory {
  id: ID!
  code: String!
  name: String!
  section: String!
  skills: [Skill!]!
}

type QuestionOption {
  label: String!
  body: String!
}

type ReviewItem {
  id: ID!

  """0 = just missed; 5 = mastered"""
  box: Int!
  dueAt: DateTime!
  wrongCount: Int!
  lastScore: Float
  mastered: Boolean!
  question: PracticeQuestion!

  """True when the item is waiting for review now"""
  isDue: Boolean!
}

enum Skill {
  SPEAKING
  WRITING
  READING
  LISTENING
}

type SkillProgress {
  skill: Skill!
  attempts: Int!

  """0..1 share of marks gained; null if no marked attempts"""
  accuracy: Float
}

type StudyPlan {
  id: ID!
  createdAt: DateTime!
  recommendedLevelCode: Int!
  skillScores: JSON!
  plan: JSON!
}

type Unit {
  id: ID!
  slug: String!
  title: String!
  summary: String!
  level: LearningLevel

  """
  Locked until the unit before it is passed (or the learner placed higher)
  """
  locked: Boolean!
  progress: UnitProgress
  lessons: [Lesson!]!

  """End-of-unit test questions, without answers"""
  testItems: [Exercise!]!
}

type UnitProgress {
  bestScore: Float!
  attempts: Int!
  passed: Boolean!
}

type Viewer {
  id: ID!
  email: String
  demoMode: Boolean!
  roles: [String!]!
  profile: Profile
  progress: Progress!

  """Consecutive study days (UTC) ending today or yesterday"""
  streakDays: Int!

  """Minutes practised today (UTC), from recorded attempt durations"""
  todayMinutes: Int!
  recentAttempts(limit: Int! = 5): [Attempt!]!

  """Next published lessons at the learner's level that are not completed"""
  recommendedLessons(limit: Int! = 3): [Lesson!]!

  """Mistake notebook. dueOnly: only items due for spaced review now"""
  reviewItems(dueOnly: Boolean! = false, limit: Int! = 50): [ReviewItem!]!

  """Mistakes due for spaced review now"""
  reviewDueCount: Int!

  """
  The learner's latest study plan from the placement test; null if not taken
  """
  studyPlan: StudyPlan
  weakAreas: [WeakArea!]!
  mockExams(limit: Int! = 5): [MockExam!]!
}

type WeakArea {
  accuracy: Float!
  attempts: Int!
  category: QuestionCategory
}
